{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h3 class="fw-bold mb-1">{{ title }}</h3>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'dashboard:home' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'departments:list' %}">Departments</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ is_edit|yesno:"Edit,Create" }}</li>
          </ol>
        </nav>
      </div>
    </div>

    <div class="card rounded-4 p-4 shadow-sm">
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <a href="{% url 'departments:list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
          <button type="submit" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-check-lg me-1"></i> {{ is_edit|yesno:"Save Changes,Create Department" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
